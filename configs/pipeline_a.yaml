# Pipeline A (basic): spatial enhancement, then a global threshold.
# Contrast stretch spreads the bright, low-contrast concrete; Gaussian smoothing suppresses
# surface texture before thresholding. Parameters are the reference values; MEM2/MEM4 tune them
# on the dev set (kernel-size and threshold-method studies).
name: pipeline_a
stages:
  - stage: contrast_stretch
    low_pct: 2
    high_pct: 98
  - stage: gaussian
    ksize: 5
  - stage: threshold_fixed
    t: 127
